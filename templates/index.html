{{define "index.html"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{.SiteDescription}}" />
    <meta name="author" content="{{.SiteAuthor}}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap"
      rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" type="text/css" />
    <title>{{.SiteTitle}}</title>
  </head>

  <body>
    {{template "nav" .}}

    <main>
      <div class="intro">
        <p>
          I'm Arpan, a programmer based out of India. You can check out my projects <a href="/projects">here</a> and go to <a href="/about">about</a> for more information about me.
        </p>
      </div>

      <h2 class="section-title">Recent Writings</h2>

      {{range .RecentPosts}}
      <div class="post-item">
        <span class="post-date">{{formatDate .RawDate}}</span>
        <a class="post-link" href="{{.URL}}">{{.Title}}</a>
      </div>
      {{end}}

      <p class="all-posts-link"><a href="/blog">All writings →</a></p>
    </main>
  </body>
</html>
{{end}}
